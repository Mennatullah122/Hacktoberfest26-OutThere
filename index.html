<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OutThere</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf7f0;--card:#fff;--ink:#17301f;--mut:#5d6b60;--g:#1f4d2f;--sage:#dfe8d9;--lime:#b8e04a;--bd:#d9dfd2;--err:#a8321f}
:root:not([data-theme=light]){}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101a13;--card:#18261c;--ink:#eef3e8;--mut:#a3b3a6;--g:#8fcf9f;--sage:#223427;--bd:#2f4434;--err:#ff8f7a}}
:root[data-theme=dark]{--bg:#101a13;--card:#18261c;--ink:#eef3e8;--mut:#a3b3a6;--g:#8fcf9f;--sage:#223427;--bd:#2f4434;--err:#ff8f7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.15;margin:0 0 .5rem}
h1{font-size:clamp(2.2rem,6vw,3.8rem)}h2{font-size:1.8rem}h3{font-size:1.2rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;gap:.25rem;align-items:center;padding:.5rem 1rem;flex-wrap:wrap}
nav b{font:700 1.3rem Georgia,serif;color:var(--g);margin-right:auto}
button,input,select,textarea{font:inherit;color:inherit}
.nb,.btn{border:1px solid transparent;background:none;padding:.5rem .8rem;border-radius:999px;cursor:pointer}
.nb:hover,.nb.on{background:var(--sage)}
.btn{background:var(--g);color:#fff;font-weight:600}
:root[data-theme=dark] .btn,@media(prefers-color-scheme:dark){}
.btn.sec{background:transparent;color:var(--g);border-color:var(--g)}
.btn.lime{background:var(--lime);color:#17301f}
.btn.sm{padding:.3rem .7rem;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
main{max-width:1050px;margin:0 auto;padding:1.5rem 1rem 4rem}
.hero{background:var(--sage);border-radius:24px;padding:2.5rem 1.5rem;margin-bottom:2rem}
.hero p{max-width:55ch;color:var(--mut);font-size:1.1rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:1rem}
.tag{display:inline-block;background:var(--sage);border-radius:999px;padding:.1rem .6rem;font-size:.8rem;margin:.1rem .2rem .1rem 0}
.tag.warn{background:#f6e3b4;color:#4a3800}.tag.bad{background:#f4cfc7;color:#6b1a0d}
.mut{color:var(--mut);font-size:.9rem}
label{display:block;font-weight:600;margin:.7rem 0 .2rem;font-size:.9rem}
input,select,textarea{width:100%;padding:.5rem .7rem;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 1rem}
.err{color:var(--err);font-size:.85rem;margin:.2rem 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom,0px));background:var(--g);color:#fff;padding:.7rem 1.2rem;border-radius:12px;z-index:9;max-width:90vw}
:root[data-theme=dark] .toast{color:#10200f}
.notice{border-left:4px solid var(--lime);background:var(--card);padding:.6rem .9rem;border-radius:8px;margin:1rem 0;font-size:.9rem}
ol li,ul li{margin:.25rem 0}
#aistat:empty{display:none}.steps{counter-reset:s}.steps .card{position:relative}
</style></head><body>
<nav aria-label="Main"><b>🌿 OutThere</b>
<button class="nb" data-v="home">Home</button><button class="nb" data-v="explore">Explore</button><button class="nb" data-v="host">Host</button><button class="nb" data-v="lab">AI Idea Lab</button><button class="nb" data-v="mine">My Activities</button><button class="nb" data-v="profile">Profile</button><button class="nb" id="authBtn"></button></nav>
<main id="app" tabindex="-1"></main>
<div id="toast" class="toast" role="status" hidden></div>
<script>
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=['Games','Language Exchange','Outdoor Adventures','Walking and Nature'];
const HOODS=['Heliopolis','Islamic Cairo','Giza','Zamalek','Maadi','Nasr City','New Cairo'];
// Venues: names only; NO coordinates, hours, fees or accessibility claimed. All unverified demo records.
const VENUES=[{id:'v1',name:'Al-Azhar Park',hood:'Islamic Cairo'},{id:'v2',name:'Merryland Park',hood:'Heliopolis'},{id:'v3',name:'Orman Garden',hood:'Giza'},{id:'v4',name:'Maadi public green space (to be confirmed)',hood:'Maadi'}];
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);d.setHours(17,0,0,0);return d.toISOString()};
const SEED=()=>[
{id:'a1',host:'seed',hostName:'Demo Host',title:'Board Games on the Grass',cat:'Games',desc:'Bring a card or board game, or join one. Beginners welcome.',venue:'v2',hood:'Heliopolis',at:day(3),dur:120,cap:8,level:'Any',tags:['beginner-friendly','small group'],mat:'Games (optional)',acc:'Not verified',rules:'Be kind, no pressure.',status:'open',people:['seed2','seed3'],seed:1},
{id:'a2',host:'seed',hostName:'Demo Host',title:'English Conversation Circle',cat:'Language Exchange',desc:'Relaxed speaking practice with prompts. All levels.',venue:'v1',hood:'Islamic Cairo',at:day(5),dur:90,cap:6,level:'Beginner–Intermediate',tags:['english','conversation'],mat:'None',acc:'Not verified',rules:'Everyone gets a turn to speak.',status:'open',people:['seed2','seed3','seed4','seed5','seed6','seed7'],seed:1},
{id:'a3',host:'seed',hostName:'Demo Host',title:'Park Treasure Hunt',cat:'Outdoor Adventures',desc:'Team clue hunt on public paths only. No climbing or restricted areas.',venue:'v3',hood:'Giza',at:day(7),dur:100,cap:10,level:'Any',tags:['teamwork','puzzles'],mat:'Phone, pen',acc:'Not verified',rules:'Stay on public paths.',status:'open',people:['seed2'],seed:1},
{id:'a4',host:'seed',hostName:'Demo Host',title:'Sunset Group Walk',cat:'Walking and Nature',desc:'Easy-pace walk with a nature-observation challenge.',venue:'v4',hood:'Maadi',at:day(2),dur:60,cap:12,level:'Any',tags:['walking','easy'],mat:'Water, comfortable shoes',acc:'Not verified',rules:'Do not pick plants or disturb wildlife.',status:'open',people:[],seed:1},
{id:'a5',host:'seed',hostName:'Demo Host',title:'Past Demo Meetup',cat:'Games',desc:'Already ended — shows the ended state.',venue:'v2',hood:'Heliopolis',at:day(-4),dur:60,cap:6,level:'Any',tags:[],mat:'',acc:'',rules:'',status:'open',people:[],seed:1}];
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let acts=load('ot_acts',null)||SEED(),users=load('ot_users',[]),me=load('ot_me',null),view='home',sel=null,filt={cat:'All',q:'',hood:'',size:'',date:''},idea=null;
const persist=()=>{save('ot_acts',acts);save('ot_users',users);save('ot_me',me)};
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)};
const ended=a=>new Date(a.at).getTime()+a.dur*6e4<Date.now();
const stat=a=>a.status==='cancelled'?'Cancelled':ended(a)?'Ended':a.people.length>=a.cap?'Full':'Open';
const fmt=a=>new Date(a.at).toLocaleString([],{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const localDay=iso=>{const d=new Date(iso);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const vname=a=>(VENUES.find(v=>v.id===a.venue)||{name:'Venue not yet confirmed'}).name;
// ---- business logic (kept pure for testing) ----
function joinRule(a,uid){if(!uid)return'Please sign in to join.';if(a.status==='cancelled')return'This activity was cancelled.';if(ended(a))return'This activity has already ended.';if(a.people.includes(uid))return'You already joined this activity.';if(a.people.length>=a.cap)return'This activity is full.';return null}
function recommend(a,u){if(!u)return{score:0,why:[]};let s=0,why=[];
 if((u.cats||[]).includes(a.cat)){s+=3;why.push('you enjoy '+a.cat.toLowerCase())}
 if((u.hoods||[]).includes(a.hood)){s+=2;why.push('it is in '+a.hood+', a neighborhood you prefer')}
 if(u.interests&&a.tags.some(t=>u.interests.toLowerCase().includes(t.split(' ')[0]))){s+=1;why.push('it matches your interests')}
 if(u.size&&a.cap<=+u.size){s+=1;why.push('it fits your preferred group size')}
 return{score:s,why}}
const filtered=()=>acts.filter(a=>(filt.cat==='All'||a.cat===filt.cat)&&(!filt.hood||a.hood===filt.hood)&&(!filt.size||a.cap<=+filt.size)&&(!filt.date||localDay(a.at)===filt.date)&&(!filt.q||(a.title+a.cat+a.hood).toLowerCase().includes(filt.q.toLowerCase())));
// ---- UI ----
function cardHtml(a){const s=stat(a),r=recommend(a,me);return`<article class="card"><span class="tag">${esc(a.cat)}</span><span class="tag ${s==='Open'?'':s==='Full'?'warn':'bad'}">${s}</span>${a.seed?'<span class="tag warn">Demo data</span>':''}
<h3>${esc(a.title)}</h3><p class="mut">${esc(a.desc)}</p><p class="mut">📍 ${esc(vname(a))} · ${esc(a.hood)}<br>🗓 ${fmt(a)} · ${a.dur} min<br>👥 ${a.people.length}/${a.cap} (${Math.max(0,a.cap-a.people.length)} left) · Host: ${esc(a.hostName)}</p>
${r.score>0?`<p class="mut">✨ Recommended because ${esc(r.why.join(' and '))}.</p>`:''}
<div class="row"><button class="btn sm sec" data-act="open" data-id="${a.id}">Details</button>${a.people.includes(me?.id)?`<button class="btn sm" data-act="leave" data-id="${a.id}">Leave</button>`:`<button class="btn sm" data-act="join" data-id="${a.id}" ${s!=='Open'?'disabled':''}>Join</button>`}</div></article>`}
const R={
home(){const f=[...acts].filter(a=>stat(a)==='Open').slice(0,3);return`<section class="hero"><h1>Your next good story starts outside.</h1><p>Meet people in Cairo through small, activity-based gatherings in public outdoor spaces. Meet through doing, not swiping.</p><div class="row"><button class="btn lime" data-go="explore">Find Your People</button><button class="btn sec" data-go="host">Host an Activity</button></div></section>
<h2>Featured activities</h2><div class="notice">Seed activities are <b>demonstration data</b>, not confirmed real-world events.</div><div class="grid">${f.map(cardHtml).join('')}</div>
<h2 style="margin-top:2rem">How it works</h2><div class="grid steps"><div class="card"><h3>1. Discover</h3>Search and filter small gatherings by category and neighborhood.</div><div class="card"><h3>2. Join</h3>Reserve a spot. Capacity is enforced and duplicates are blocked.</div><div class="card"><h3>3. Show up</h3>Meet in a public place, play, talk, walk.</div></div>
<h2 style="margin-top:2rem">AI Idea Lab</h2><div class="card">Not sure what to run? Gemma, an open-weight model running in your browser, plans an outdoor activity that fits your group, time, area and budget. <br><br><button class="btn sm" data-go="lab">Open Idea Lab</button></div>
<h2 style="margin-top:2rem">Community guidelines &amp; safety</h2><div class="card"><ul><li>Participation is voluntary. Always meet in public places.</li><li>Don't share your home address or precise location.</li><li>Respect nature: stay on public paths, don't pick plants or disturb wildlife.</li><li>Report problems from any activity page.</li></ul><p class="mut"><b>Implemented:</b> join/capacity rules, host cancel, reporting form (stored locally). <b>Planned:</b> moderation review, identity/venue verification. No host, venue or event here is verified.</p></div>`},
explore(){return`<h2>Explore activities</h2><div class="card"><div class="fg"><div><label for="q">Search</label><input id="q" value="${esc(filt.q)}" placeholder="Name, category, neighborhood"></div>
<div><label for="fh">Neighborhood</label><select id="fh"><option value="">Any</option>${HOODS.map(h=>`<option ${filt.hood===h?'selected':''}>${h}</option>`).join('')}</select></div>
<div><label for="fs">Max group size</label><select id="fs">${['','4','6','8','12'].map(s=>`<option value="${s}" ${filt.size===s?'selected':''}>${s||'Any'}</option>`).join('')}</select></div>
<div><label for="fd">Date</label><input id="fd" type="date" value="${filt.date}"></div></div>
<div class="row" style="margin-top:.7rem">${['All',...CATS].map(c=>`<button class="btn sm ${filt.cat===c?'':'sec'}" data-cat="${c}" aria-pressed="${filt.cat===c}">${c==='All'?'All Activities':c}</button>`).join('')}</div></div>
<div class="grid" id="list" style="margin-top:1rem"></div>`},
detail(){const a=acts.find(x=>x.id===sel);if(!a)return'<p>Activity not found.</p>';const s=stat(a),mine=a.host===me?.id;const v=VENUES.find(x=>x.id===a.venue);
return`<button class="btn sm sec" data-go="explore">← Back</button><div class="card" style="margin-top:1rem"><span class="tag">${esc(a.cat)}</span><span class="tag">${s}</span>${a.seed?'<span class="tag warn">Demo data — not a real event</span>':''}<h2>${esc(a.title)}</h2><p>${esc(a.desc)}</p>
<p>📍 ${esc(vname(a))}, ${esc(a.hood)} <span class="tag warn">Venue details unverified</span> <a href="https://www.openstreetmap.org/search?query=${encodeURIComponent(vname(a)+', '+a.hood+', Cairo')}" target="_blank" rel="noopener">Search on OpenStreetMap</a><br>🗓 ${fmt(a)} · ${a.dur} min<br>👥 ${a.people.length}/${a.cap} joined · Level: ${esc(a.level||'Any')}<br>🧰 Materials: ${esc(a.mat||'None listed')}<br>♿ Accessibility: ${esc(a.acc||'Not provided')}<br>📜 Rules: ${esc(a.rules||'None listed')}</p>
<p class="mut">Participant identities are not shown publicly. Meet only in public places; participation is voluntary.</p>
<div class="row">${a.people.includes(me?.id)?`<button class="btn" data-act="leave" data-id="${a.id}">Leave</button>`:`<button class="btn" data-act="join" data-id="${a.id}" ${s!=='Open'?'disabled':''}>Join</button>`}
${mine&&a.status!=='cancelled'?`<button class="btn sec" data-act="cancel" data-id="${a.id}">Cancel activity</button>`:''}<button class="btn sec" data-act="report" data-id="${a.id}">Report</button></div></div>`},
host(){if(!me)return needAuth('host an activity');return`<h2>Host an activity</h2><form id="hf" class="card" novalidate><div class="fg"><div><label for="t">Title *</label><input id="t" maxlength="80"></div><div><label for="c">Category *</label><select id="c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
<div><label for="vn">Public venue *</label><select id="vn">${VENUES.map(v=>`<option value="${v.id}">${v.name}</option>`).join('')}</select></div><div><label for="dt">Date &amp; time *</label><input id="dt" type="datetime-local"></div>
<div><label for="du">Duration (min) *</label><input id="du" type="number" value="90" min="15" max="480"></div><div><label for="cp">Max participants *</label><input id="cp" type="number" value="8" min="2" max="30"></div><div><label for="lv">Language / difficulty level</label><input id="lv" placeholder="e.g. Beginner"></div><div><label for="ma">Required materials</label><input id="ma"></div></div>
<label for="ds">Description *</label><textarea id="ds" rows="3"></textarea><label for="ac">Accessibility information</label><input id="ac"><label for="ru">Community rules / notes</label><input id="ru">
<p class="mut">Venue neighborhood is taken from the venue. Venues are unverified demo records — check before real use.</p><div id="he" class="err"></div><button class="btn">Publish activity</button></form>`},
lab(){const o=(id,l,arr,v)=>`<div><label for="${id}">${l}</label><select id="${id}">${arr.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select></div>`;const c=AI.cfg;
return`<h2>AI Idea Lab</h2><div class="notice">Plans come from <b>Gemma</b>, Google's open-weight model. If your browser supports WebGPU, Gemma runs <b>entirely on your device</b>: after a one-time download (about 1.5&nbsp;GB, cached), nothing you type leaves it. Otherwise your form answers are sent to <b>Gemma 4 on Google AI Studio</b>, which may log them, so don't include personal details. You can also use your own Ollama server under Model settings. Every plan says which model made it.</div>
<form id="lf" class="card"><div class="fg">${o('lc','Category',CATS)}${o('la','Area',HOODS,(me?.hoods||[])[0])}<div><label for="ln">Participants</label><input id="ln" type="number" value="6" min="2" max="30"></div><div><label for="ld">Time available (min)</label><input id="ld" type="number" value="60" min="15" max="240"></div>${o('lb','Budget per person',['Free','Under 50 EGP','Under 150 EGP'])}${o('lg','Group familiarity',['strangers','acquaintances','friends'])}${o('lo','Objective',['break the ice','practice a language','collaborate','explore nature','have fun'])}${o('ll','Instruction language',['English','Arabic'])}${o('lf2','Difficulty',['easy','medium'])}<div><label for="li">Interests</label><input id="li" value="${esc(me?.interests||'')}" placeholder="e.g. photography, chess"></div><div><label for="lm">Available materials</label><input id="lm" placeholder="e.g. paper, pens"></div></div>
<details style="margin-top:.8rem"><summary>Model settings</summary><div class="fg">${o('ae','Engine',['Auto (on-device, else hosted)','On-device Gemma (WebLLM)','Hosted Gemma (Google AI Studio)','Ollama / OpenAI-compatible endpoint'],c.engine)}<div><label for="au">Endpoint base URL</label><input id="au" value="${esc(c.url)}" placeholder="http://localhost:11434/v1"></div><div><label for="am">Endpoint model</label><input id="am" value="${esc(c.model)}" placeholder="gemma3:4b"></div></div><p class="mut">For Ollama, start it with <code>OLLAMA_ORIGINS=*</code> so the browser may call it. WebLLM needs a browser with WebGPU (recent Chrome or Edge).</p></details>
<div class="row" style="margin-top:.9rem"><button class="btn" value="live">Generate with Gemma</button><button class="btn sec" value="tpl">Use template instead</button></div></form><div id="aistat" class="notice" role="status" aria-live="polite" style="font-weight:600"></div><div id="plan"></div>`},
mine(){if(!me)return needAuth('see your activities');const j=acts.filter(a=>a.people.includes(me.id)),h=acts.filter(a=>a.host===me.id);return`<h2>My activities</h2><h3>Joined</h3><div class="grid">${j.map(cardHtml).join('')||'<p class="mut">Nothing yet. <button class="btn sm" data-go="explore">Explore</button></p>'}</div><h3 style="margin-top:1.5rem">Hosting</h3><div class="grid">${h.map(cardHtml).join('')||'<p class="mut">You are not hosting anything. <button class="btn sm" data-go="host">Host one</button></p>'}</div>`},
profile(){if(!me)return needAuth('edit your profile');const u=me;return`<h2>Profile</h2><form id="pf" class="card"><div class="fg"><div><label for="pn">Display name</label><input id="pn" value="${esc(u.name)}"></div><div><label for="pi">Interests (comma separated)</label><input id="pi" value="${esc(u.interests||'')}"></div><div><label for="ps">Preferred group size (max)</label><input id="ps" type="number" min="2" value="${esc(u.size||'')}"></div><div><label for="pl">Languages spoken / learning</label><input id="pl" value="${esc(u.langs||'')}"></div></div>
<label>Preferred categories</label><div class="row">${CATS.map(c=>`<label style="font-weight:400"><input type="checkbox" style="width:auto" name="pc" value="${c}" ${(u.cats||[]).includes(c)?'checked':''}> ${c}</label>`).join('')}</div>
<label>Preferred neighborhoods (general areas only, never your address)</label><div class="row">${HOODS.map(c=>`<label style="font-weight:400"><input type="checkbox" style="width:auto" name="ph" value="${c}" ${(u.hoods||[]).includes(c)?'checked':''}> ${c}</label>`).join('')}</div><br><button class="btn">Save profile</button></form><p class="mut">Recommendations use a transparent score: category +3, neighborhood +2, interests +1, group size +1. No machine learning.</p>`},
auth(){return`<h2>Sign in / Register</h2><div class="notice"><b>Demo-only auth:</b> accounts live in this browser's storage and are not secure. The full build uses Supabase Auth with Row Level Security. Don't enter a real password.</div><form id="af" class="card"><div class="fg"><div><label for="an">Display name (register)</label><input id="an"></div><div><label for="ae">Email</label><input id="ae" type="email"></div><div><label for="ap">Demo password</label><input id="ap" type="password"></div></div><div id="ae2" class="err"></div><div class="row" style="margin-top:.7rem"><button class="btn" value="in">Sign in</button><button class="btn sec" value="reg">Register</button></div></form>`}};
const needAuth=w=>`<div class="card"><h3>Please sign in to ${w}</h3><button class="btn" data-go="auth">Sign in / Register</button></div>`;
function go(v,id){view=v;if(id)sel=id;render();scrollTo(0,0)}
const banner=()=>`<div class="notice"><b>Local demo mode:</b> activities and accounts live only in this browser. Items tagged “Demo data” are not real events.</div>`;
function render(){$('#app').innerHTML=banner()+R[view]();$('#authBtn').textContent=me?'Sign out ('+me.name+')':'Sign in';document.querySelectorAll('.nb[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));if(view==='explore')list()}
function list(){const f=filtered();$('#list').innerHTML=f.length?f.map(cardHtml).join(''):'<div class="card"><h3>No activities match</h3><p class="mut">Try clearing filters or host your own.</p><button class="btn sm" data-go="host">Host an activity</button></div>'}
// ---- AI fallback templates ----
function makePlan(p){const ar=p.ll==='Arabic',n=+p.ln,sm=n<=4;const base={'Games':'Team Charades Circuit','Language Exchange':'Story Chain Speaking Circle','Outdoor Adventures':'Public Path Clue Hunt','Walking and Nature':'Noticing Walk'}[p.lc];
const prompts={strangers:['What is one place in Cairo you love?','What would you do with a free afternoon?','Which skill are you learning?'],acquaintances:['What surprised you this week?','Share a small win.'],friends:['Best memory outdoors?','What should we try next?']}[p.lg];
return{title:base,desc:`A ${p.lf2} ${p.lc.toLowerCase()} activity for ${n} people in a public park in ${p.la}, built to ${p.lo}. Budget: ${p.lb}.`,objective:p.lo,duration:p.ld+' min',size:`${Math.max(2,n-2)}–${n+2}`,materials:p.lm||'None needed',
steps:['Welcome and share the rules (5 min).','Pair or group up, mixing people who do not know each other.','Run 2–3 short rounds of the main task, rotating partners.','Pause for water and casual chat.','Finish with the closing reflection.'],prompts,
variations:[sm?'With 4 or fewer: play as one group, take turns.':'With 8+: split into groups of 3–4.','Short on time: do one round only.','No materials: use spoken prompts only.'],
access:['Offer seated options and a shaded spot.','Allow passing without explanation.','Use simple, clear language.'],safety:['Meet in a public, open area.','Stay on public paths; never enter restricted areas.','No climbing, running on uneven ground, picking plants or disturbing wildlife.','Anyone may leave at any time.'],closing:'Each person shares one thing they enjoyed and one thing they would try again.',lang:ar?'Arabic requested — template text is English only in this fallback.':''}}
const L=a=>'<ul>'+a.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';
function showPlan(p){return`<div class="card" style="margin-top:1rem">${p.live?`<span class="tag">Generated by ${esc(p.live)}</span>`:'<span class="tag warn">Template fallback — not AI-generated</span>'}<span class="tag warn">Not verified venue info</span><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p>${p.why?`<p>✨ ${esc(p.why)}</p>`:''}<p><b>Objective:</b> ${esc(p.objective)} · <b>Duration:</b> ${p.duration} · <b>Group:</b> ${p.size}</p><p><b>Materials:</b> ${esc(p.materials)}</p><b>Steps</b><ol>${p.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><b>Prompts</b>${L(p.prompts)}<b>Variations</b>${L(p.variations)}<b>Accessibility</b>${L(p.access)}<b>Safety</b>${L(p.safety)}<b>Closing</b><p>${esc(p.closing)}</p>${p.lang?`<p class="mut">${esc(p.lang)}</p>`:''}<div class="row"><button class="btn sm sec" data-act="adapt" data-k="fewer">Adapt: fewer people</button><button class="btn sm sec" data-act="adapt" data-k="time">Adapt: less time</button><button class="btn sm sec" data-act="adapt" data-k="quiet">Adapt: quieter</button></div></div>`}
// ---- events ----
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.v)return go(t.dataset.v);if(t.dataset.go)return go(t.dataset.go);
if(t.id==='authBtn'){if(me){me=null;persist();toast('Signed out');return go('home')}return go('auth')}
if(t.dataset.cat){filt.cat=t.dataset.cat;return render()}
const a=acts.find(x=>x.id===t.dataset.id),k=t.dataset.act;if(!k)return;
if(k==='open')return go('detail',a.id);
if(k==='join'){const m=joinRule(a,me?.id);if(m){toast(m);if(!me)go('auth');return}a.people.push(me.id);persist();toast('You joined “'+a.title+'”.');return render()}
if(k==='leave'){a.people=a.people.filter(x=>x!==me?.id);persist();toast('You left the activity.');return render()}
if(k==='cancel'){if(a.host!==me?.id)return toast('Only the host can cancel.');if(confirm('Cancel this activity?')){a.status='cancelled';persist();toast('Activity cancelled.');render()}return}
if(k==='report'){if(!me)return toast('Sign in to report.'),go('auth');const r=prompt('Reason for report (stored locally in this demo):');if(r){const rp=load('ot_reports',[]);rp.push({by:me.id,act:a.id,reason:r,at:Date.now()});save('ot_reports',rp);toast('Report recorded. Thank you.')}return}
if(k==='adapt'&&idea){const m={fewer:'For 2–3 people: pair up and alternate roles each round.',time:'With 20 minutes: do one round and a one-sentence closing.',quiet:'Quieter version: small pairs, written or whispered prompts, no performing in front of the group.'}[t.dataset.k];idea.variations=[m,...idea.variations];$('#plan').innerHTML=showPlan(idea);toast('Plan adapted.')}});
document.addEventListener('input',e=>{if(view!=='explore')return;const m={q:'q',fh:'hood',fs:'size',fd:'date'}[e.target.id];if(m){filt[m]=e.target.value;list()}});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;
if(id==='af'){const kind=e.submitter?.value,em=$('#ae').value.trim().toLowerCase(),pw=$('#ap').value,nm=$('#an').value.trim(),er=$('#ae2');
 if(!/^\S+@\S+\.\S+$/.test(em)||pw.length<6){er.textContent='Enter a valid email and a password of 6+ characters.';return}
 if(kind==='reg'){if(!nm){er.textContent='Display name required.';return}if(users.find(u=>u.email===em)){er.textContent='Email already registered.';return}const u={id:'u'+Date.now(),email:em,pw,name:nm,cats:[],hoods:[]};users.push(u);me={...u}}
 else{const u=users.find(u=>u.email===em&&u.pw===pw);if(!u){er.textContent='Wrong email or password.';return}me={...u}}
 delete me.pw;persist();toast('Welcome, '+me.name+'!');go('explore')}
if(id==='hf'){const g=i=>$('#'+i).value.trim(),er=[];if(g('t').length<4)er.push('Title needs 4+ characters.');if(g('ds').length<20)er.push('Description needs 20+ characters.');if(!g('dt'))er.push('Date and time required.');else if(new Date(g('dt'))<new Date())er.push('Start must be in the future.');const cp=+g('cp'),du=+g('du');if(!(cp>=2&&cp<=30))er.push('Capacity must be 2–30.');if(!(du>=15&&du<=480))er.push('Duration must be 15–480 min.');
 if(er.length){$('#he').innerHTML=er.map(esc).join('<br>');return}
 const v=VENUES.find(x=>x.id===g('vn'));const a={id:'a'+Date.now(),host:me.id,hostName:me.name,title:g('t'),cat:g('c'),desc:g('ds'),venue:v.id,hood:v.hood,at:new Date(g('dt')).toISOString(),dur:du,cap:cp,level:g('lv'),tags:[],mat:g('ma'),acc:g('ac'),rules:g('ru'),status:'open',people:[me.id]};acts.unshift(a);persist();toast('Activity published!');go('detail',a.id)}
if(id==='lf'){const p={};['lc','la','ln','ld','lb','lg','lo','ll','lf2','li','lm'].forEach(i=>p[i]=$('#'+i).value.trim());AI.save();if(e.submitter&&e.submitter.value==='live'){liveGen(p);return}idea=makePlan(p);$('#plan').innerHTML=showPlan(idea)}
if(id==='pf'){me.name=$('#pn').value.trim()||me.name;me.interests=$('#pi').value;me.size=$('#ps').value;me.langs=$('#pl').value;me.cats=[...document.querySelectorAll('[name=pc]:checked')].map(x=>x.value);me.hoods=[...document.querySelectorAll('[name=ph]:checked')].map(x=>x.value);const i=users.findIndex(u=>u.id===me.id);if(i>=0)users[i]={...users[i],...me};persist();toast('Profile saved.');render()}});

const SAFE=['Meet in a public, open area; participation is voluntary.','Stay on public paths; never enter restricted areas.','No climbing, picking plants or disturbing wildlife.'];
const sa=(v,n)=>Array.isArray(v)&&v.length>=n&&v.length<=12&&v.every(x=>typeof x==='string'&&x.trim()&&x.length<400);
function validPlan(r){if(!r||typeof r!=='object')return null;const st=k=>typeof r[k]==='string'&&r[k].trim()&&r[k].length<600;
 if(!['title','desc','objective','closing'].every(st)||!sa(r.steps,3)||!sa(r.prompts,1)||!sa(r.variations,1)||!sa(r.access,1))return null;
 return{title:r.title,desc:r.desc,objective:r.objective,duration:String(r.duration||'').slice(0,40)||'n/a',size:String(r.size||'').slice(0,40)||'n/a',materials:String(r.materials||'None').slice(0,200),steps:r.steps,prompts:r.prompts,variations:r.variations,access:r.access,safety:[...(sa(r.safety,1)?r.safety:[]),...SAFE],closing:r.closing,why:typeof r.why==='string'?r.why.slice(0,300):'',lang:''}}
// ---- Open-weight AI: Gemma on-device (WebLLM) or any OpenAI-compatible endpoint (Ollama, vLLM, HF) ----
// Hosted fallback: your Supabase Edge Function URL (see supabase/functions/gemma-plan). Leave '' to disable.
const HOSTED_URL='https://txsybrxqgfaeetmhrlav.supabase.co/functions/v1/hyper-function';
const WEBLLM='https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.85/+esm';
const AI={engine:null,modelId:null,cfg:load('ot_ai2',{engine:'Auto (on-device, else hosted)',url:'',model:''}),
 save(){const v=i=>$('#'+i)?.value.trim();if($('#ae'))this.cfg={engine:v('ae'),url:v('au'),model:v('am')};save('ot_ai2',this.cfg)},
 async local(prompt,status){if(!navigator.gpu)throw{code:'WebGPU not available in this browser'};
  if(!this.engine){status('Loading Gemma into your browser…');const ad=await navigator.gpu.requestAdapter();const f16=ad&&ad.features.has('shader-f16');
   this.modelId=f16?'gemma-2-2b-it-q4f16_1-MLC':'gemma-2-2b-it-q4f32_1-MLC';const webllm=await import(WEBLLM);
   this.engine=await webllm.CreateMLCEngine(this.modelId,{initProgressCallback:r=>{const pc=Math.round((r.progress||0)*100);status(/cache|fetch/i.test(r.text)?`Downloading Gemma to your browser (one time, about 1.5 GB): ${pc}%. Next time it starts in seconds.`:pc>=100||/load|shader|init/i.test(r.text)?'Preparing Gemma on your GPU…':'Getting Gemma ready…')}})}
  status('Gemma is writing your plan on this device…');
  const r=await this.engine.chat.completions.create({messages:[{role:'user',content:prompt}],temperature:.7,max_tokens:900,response_format:{type:'json_object'}});
  return{text:r.choices[0].message.content,label:this.modelId+' running on your device (WebLLM)'}},
 async hosted(p,status){if(!HOSTED_URL)throw{code:'hosted Gemma is not configured on this site'};status('Sending your request to Gemma 4 on Google AI Studio…');
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),60000);
  try{const r=await fetch(HOSTED_URL,{method:'POST',signal:ctl.signal,headers:{'content-type':'application/json'},body:JSON.stringify(p)});const d=await r.json().catch(()=>({}));
   if(!r.ok)throw{code:d.error||('server returned '+r.status)};return{text:d.text,label:(d.model||'Gemma')+' via Google AI Studio (your inputs were sent to Google\'s servers)'}}
  catch(e){throw e&&e.name==='AbortError'?{code:'the hosted model took too long'}:e}finally{clearTimeout(t)}},
 async canLocal(){try{return !!(navigator.gpu&&await navigator.gpu.requestAdapter())}catch(e){return false}},
 async remote(prompt,status){const base=(this.cfg.url||'').replace(/\/+$/,''),m=this.cfg.model;if(!base||!m)throw{code:'set the endpoint URL and model in Model settings'};
  status('Asking '+m+'…');const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),60000);
  try{const r=await fetch(base+'/chat/completions',{method:'POST',signal:ctl.signal,headers:{'content-type':'application/json'},body:JSON.stringify({model:m,temperature:.7,messages:[{role:'user',content:prompt}]})});
   if(!r.ok)throw{code:'endpoint returned '+r.status};const d=await r.json();return{text:d.choices[0].message.content,label:m+' via '+new URL(base).host}}finally{clearTimeout(t)}}};
const parseJSON=t=>{const a=String(t).indexOf('{'),b=String(t).lastIndexOf('}');if(a<0||b<a)return null;try{return JSON.parse(t.slice(a,b+1))}catch(e){return null}};
const prompt=p=>`You plan small, safe, low-cost social activities in public outdoor spaces in Cairo, Egypt. Get people off their screens: phones should stay in pockets.
Plan one activity for: category=${p.lc}; area=${p.la}; participants=${p.ln}; time available=${p.ld} minutes; budget per person=${p.lb}; group=${p.lg}; objective=${p.lo}; difficulty=${p.lf2}; interests=${p.li||'none given'}; materials on hand=${p.lm||'none'}.
Rules: stay within the time and budget; never invent venue names, opening hours, fees or crowd levels (say "a public park in ${p.la}"); no trespassing, climbing, dangerous challenges, picking plants or disturbing wildlife.
Write all text values in ${p.ll}. Reply with ONLY a JSON object with keys: title, desc, objective, duration, size, materials (strings); why (string: one sentence on why it fits these interests and constraints); steps (3-7 strings); prompts, variations, access, safety (arrays of strings); closing (string).`;
async function liveGen(p){const out=$('#plan'),st=$('#aistat'),btn=$('#lf button[value=live]');if(btn.disabled)return;const status=m=>st.textContent=m;out.innerHTML='';btn.disabled=true;btn.textContent='Working…';
 try{const eng=AI.cfg.engine;let r;
  if(eng==='Ollama / OpenAI-compatible endpoint')r=await AI.remote(prompt(p),status);
  else if(eng==='Hosted Gemma (Google AI Studio)')r=await AI.hosted(p,status);
  else if(eng==='On-device Gemma (WebLLM)')r=await AI.local(prompt(p),status);
  else if(await AI.canLocal()){try{r=await AI.local(prompt(p),status)}catch(e){console.warn(e);if(!HOSTED_URL)throw e;r=await AI.hosted(p,status)}}
  else r=await AI.hosted(p,status);
  const v=validPlan(parseJSON(r.text));if(!v)throw{code:'the model returned an incomplete plan'};idea={...v,live:r.label};status('');out.innerHTML=showPlan(idea)}
 catch(e){console.error(e);status('');idea=makePlan(p);out.innerHTML=`<div class="err">Live generation failed: ${esc(e&&(e.code||e.message)||'error')}. Showing the template instead.</div>`+showPlan(idea)}
 finally{const b=$('#lf button[value=live]');if(b){b.disabled=false;b.textContent='Generate with Gemma'}}}
render();
</script></body></html>
